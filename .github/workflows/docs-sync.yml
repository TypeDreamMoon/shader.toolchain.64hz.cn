name: Sync plugin documentation

on:
  repository_dispatch:
    types: [plugin-docs-updated]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact plugin SHA (empty means current plugin main)
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: sync-plugin-docs
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      artifact: docs-site-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Validate source event
        id: event
        env:
          DOCS_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -B scripts/docs_ci.py event
      - name: Checkout the exact plugin revision
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.event.outputs.repository }}
          ref: ${{ steps.event.outputs.plugin_ref }}
          path: .docs-sync-tmp/plugin
          fetch-depth: 0
          token: ${{ secrets.DOCS_SOURCE_TOKEN || github.token }}
          persist-credentials: false
      - name: Require a commit on the plugin publishing branch
        env:
          PLUGIN_BRANCH: ${{ steps.event.outputs.plugin_branch }}
        run: git -C .docs-sync-tmp/plugin merge-base --is-ancestor HEAD "origin/$PLUGIN_BRANCH"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -B -m unittest discover -s scripts -p 'test_docs*.py'
      - name: Generate English and source snapshots (Chinese stays unchanged)
        run: python3 -B scripts/docs_sync.py sync --plugin .docs-sync-tmp/plugin --report .docs-sync-tmp/status.md
      - run: python3 -B scripts/docs_sync.py validate
      - run: npm run typecheck
      - run: npm run build
      - run: python3 -B scripts/check-links.py
      - name: Commit only generated source documents
        id: commit
        run: python3 -B scripts/docs_ci.py commit-source
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          retention-days: 3
      - name: Translation summary
        if: always()
        run: python3 -B scripts/docs_sync.py status >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: sync
    uses: ./.github/workflows/deploy.yml
    with:
      site_ref: ${{ needs.sync.outputs.sha }}
      artifact: ${{ needs.sync.outputs.artifact }}
    secrets: inherit
  translations:
    needs: sync
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/docs-translate.yml
    secrets: inherit
