name: Draft Chinese translations

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - docs-sync/config.json
      - docs-sync/glossary.json

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: draft-chinese-translations
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Resolve the plugin publishing branch
        id: source
        run: python3 -B scripts/docs_ci.py translation-source
      - name: Checkout the latest merged plugin documents
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.plugin_branch }}
          path: .docs-sync-tmp/plugin
          fetch-depth: 0
          # Read-only credentials may inspect status. A draft requires the
          # explicit plugin-write token checked by prepare-translation; open-pr
          # hands it to git for the push only, so npm ci and the build below
          # never run with it in the checkout's configuration.
          token: ${{ secrets.DOCS_PR_TOKEN || secrets.DOCS_SOURCE_TOKEN || github.token }}
          persist-credentials: false
      - name: Preview the latest merged plugin documents locally
        run: python3 -B scripts/docs_sync.py sync --plugin .docs-sync-tmp/plugin
      - name: Verify committed source snapshot
        run: python3 -B scripts/docs_sync.py validate
      - name: Update the persistent translation checklist
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/docs_ci.py issue --plugin .docs-sync-tmp/plugin
      - name: Preserve any translation PR already under review
        id: prepare
        env:
          DOCS_SITE_TOKEN: ${{ github.token }}
          DOCS_PR_TOKEN: ${{ secrets.DOCS_PR_TOKEN }}
          DOCS_AI_API_KEY: ${{ secrets.DOCS_AI_API_KEY }}
          DOCS_AI_MODEL: ${{ vars.DOCS_AI_MODEL }}
        run: python3 -B scripts/docs_ci.py prepare-translation --plugin .docs-sync-tmp/plugin
      - uses: actions/setup-node@v5
        if: steps.prepare.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.prepare.outputs.ready == 'true'
        run: npm ci
      - name: AI translation drafts
        id: translate
        if: steps.prepare.outputs.ready == 'true'
        env:
          DOCS_AI_BASE_URL: ${{ vars.DOCS_AI_BASE_URL }}
          DOCS_AI_API_KEY: ${{ secrets.DOCS_AI_API_KEY }}
          DOCS_AI_MODEL: ${{ vars.DOCS_AI_MODEL }}
          DOCS_AI_API_FORMAT: ${{ vars.DOCS_AI_API_FORMAT }}
          DOCS_AI_JSON_MODE: ${{ vars.DOCS_AI_JSON_MODE }}
          DOCS_AI_MAX_PAGES: ${{ vars.DOCS_AI_MAX_PAGES }}
          DOCS_AI_MAX_INPUT_CHARS: ${{ vars.DOCS_AI_MAX_INPUT_CHARS }}
          DOCS_AI_MAX_OUTPUT_TOKENS: ${{ vars.DOCS_AI_MAX_OUTPUT_TOKENS }}
          DOCS_AI_TIMEOUT: ${{ vars.DOCS_AI_TIMEOUT }}
          DOCS_AI_CHUNK_CHARS: ${{ vars.DOCS_AI_CHUNK_CHARS }}
          DOCS_AI_TOKEN_FIELD: ${{ vars.DOCS_AI_TOKEN_FIELD }}
        run: python3 -B scripts/docs_sync.py translate --plugin .docs-sync-tmp/plugin
      - name: Validate draft before opening a PR
        id: validation
        continue-on-error: true
        if: steps.prepare.outputs.ready == 'true'
        env:
          DOCS_TRANSLATION_PREVIEW: 'true'
        run: |
          python3 -B scripts/docs_sync.py sync --plugin .docs-sync-tmp/plugin
          python3 -B scripts/docs_sync.py validate
          npm run typecheck
          npm run build
          python3 -B scripts/check-links.py
      - name: Open a plugin PR for human review (never merge or deploy here)
        if: steps.prepare.outputs.ready == 'true' && steps.translate.outcome == 'success' && !cancelled()
        env:
          DOCS_PR_TOKEN: ${{ secrets.DOCS_PR_TOKEN }}
          DOCS_DRAFT_VALIDATION: ${{ steps.validation.outcome }}
        run: python3 -B scripts/docs_ci.py open-pr --plugin .docs-sync-tmp/plugin
      - name: Report draft validation failure
        if: steps.validation.outcome == 'failure'
        run: exit 1
